<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text2Anim Basic</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --text:#152033; --muted:#64748b; --line:#dbe2ea; --accent:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1100px; margin:0 auto; padding:36px 20px 60px; }
    h1 { margin:0 0 8px; font-size:34px; }
    .sub { color:var(--muted); margin-bottom:22px; }
    .grid { display:grid; grid-template-columns:360px 1fr; gap:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 8px 30px rgba(20,35,60,.05); }
    textarea { width:100%; min-height:180px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:13px; font:inherit; }
    button { border:0; border-radius:10px; padding:12px 16px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; margin-top:12px; }
    .status { color:var(--muted); min-height:24px; }
    .stage { width:100%; aspect-ratio:16/9; background:#eef2f7; border-radius:12px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }
    .meta { margin-top:12px; font-size:13px; color:var(--muted); white-space:pre-wrap; }
    @media (max-width: 800px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Text2Anim</h1>
    <div class="sub">Turn a short explanation into a basic animated diagram. No installation for users.</div>
    <div class="grid">
      <section class="card">
        <label for="prompt"><strong>Describe the animation</strong></label>
        <textarea id="prompt" placeholder="Example: Explain how a compiler turns source code into an executable."></textarea>
        <div class="row">
          <button id="generate">Generate</button>
          <button id="demo" type="button">Demo</button>
        </div>
        <div class="status" id="status"></div>
      </section>
      <section class="card">
        <div class="stage"><canvas id="canvas" width="1280" height="720"></canvas></div>
        <div class="meta" id="meta">Generate a scene to begin.</div>
      </section>
    </div>
  </div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const promptEl = document.getElementById('prompt');
const statusEl = document.getElementById('status');
const metaEl = document.getElementById('meta');
const genBtn = document.getElementById('generate');
const demoBtn = document.getElementById('demo');
let scene = null;
let raf = null;

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function textFit(text,max){return text.length>max?text.slice(0,max-1)+'…':text;}

function layout(scene){
  const n=scene.items.length;
  if(scene.scene_type==='timeline') return scene.items.map((it,i)=>({x:120+i*(1040/Math.max(1,n-1)),y:360}));
  if(scene.scene_type==='comparison') return scene.items.map((it,i)=>({x:250+(i%2)*780,y:220+Math.floor(i/2)*250}));
  return scene.items.map((it,i)=>({x:140+i*(1000/Math.max(1,n-1)),y:360}));
}

function drawScene(now){
  if(!scene) return;
  const start=scene._start||now; const elapsed=(now-start)/1000; const positions=layout(scene);
  const dark=scene.theme==='dark';
  ctx.fillStyle=dark?'#0f172a':'#f8fafc'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=dark?'#f8fafc':'#172033'; ctx.font='700 34px system-ui'; ctx.textAlign='center'; ctx.fillText(scene.title,640,72);

  // connectors
  if(scene.items.length>1){
    ctx.strokeStyle=dark?'#64748b':'#9aa8ba'; ctx.lineWidth=7; ctx.lineCap='round';
    for(let i=0;i<positions.length-1;i++){
      const a=positions[i],b=positions[i+1];
      if(scene.scene_type==='timeline'){
        ctx.beginPath();ctx.moveTo(a.x+90,a.y);ctx.lineTo(b.x-90,b.y);ctx.stroke();
      }else if(scene.scene_type==='process_flow'){
        ctx.beginPath();ctx.moveTo(a.x+105,a.y);ctx.lineTo(b.x-105,b.y);ctx.stroke();
      }
    }
  }

  for(const [i,it] of scene.items.entries()){
    const pos=positions[i];
    const acts=(scene.actions||[]).filter(a=>a.target===it.id);
    let opacity=1, scale=1, highlight=false, dx=0;
    for(const a of acts){
      const local=Math.max(0,Math.min(1,(elapsed-a.start)/a.duration));
      const e=ease(local);
      if(a.type==='fade_in') opacity=Math.min(opacity,e);
      if(a.type==='scale') scale=Math.max(scale,1+.08*e);
      if(a.type==='highlight' && local>0 && local<1) highlight=true;
      if(a.type==='move') dx+=60*e;
    }
    ctx.save(); ctx.globalAlpha=opacity; ctx.translate(dx,0); ctx.translate(pos.x,pos.y); ctx.scale(scale,scale);
    const m=boxMetrics(it);
    const w=m.w,h=m.h;
    ctx.fillStyle=highlight?(dark?'#f59e0b':'#fde68a'):(dark?'#1e293b':'#ffffff');
    ctx.strokeStyle=highlight?(dark?'#f59e0b':'#d97706'):(dark?'#475569':'#cbd5e1'); ctx.lineWidth=5;
    roundRect(ctx,-w/2,-h/2,w,h,20); ctx.fill();ctx.stroke();
    ctx.fillStyle=dark?'#f8fafc':'#172033';
    ctx.font=`700 ${m.labelSize}px system-ui`;
    const labelLineH=m.labelSize+4;
    const labelStart=-((m.labelLines.length-1)*labelLineH)/2-(m.detailLines.length?18:0);
    m.labelLines.forEach((line,idx)=>ctx.fillText(line,0,labelStart+idx*labelLineH));
    if(m.detailLines.length){
      ctx.fillStyle=dark?'#cbd5e1':'#667085'; ctx.font=`${m.detailSize}px system-ui`;
      const detailStart=labelStart+m.labelLines.length*labelLineH+12;
      const detailLineH=m.detailSize+4;
      m.detailLines.forEach((line,idx)=>ctx.fillText(line,0,detailStart+idx*detailLineH));
    }
    ctx.restore();
  }
  if(elapsed < scene.duration + 1) raf=requestAnimationFrame(drawScene);
}

function showScene(s){
  cancelAnimationFrame(raf); scene=s; scene._start=performance.now(); metaEl.textContent=`${s.scene_type} · ${Math.round(s.duration)}s · ${s.items.length} items`; raf=requestAnimationFrame(drawScene);
}

demoBtn.onclick=()=>{
  promptEl.value='Explain how a compiler turns source code into an executable.';
  showScene({title:'How a Compiler Works',scene_type:'process_flow',theme:'light',duration:8,items:[{id:'a',label:'Source Code',detail:'your program'},{id:'b',label:'Compiler',detail:'translates it'},{id:'c',label:'Executable',detail:'ready to run'}],actions:[{type:'fade_in',target:'a',start:0,duration:.7},{type:'fade_in',target:'b',start:2,duration:.7},{type:'highlight',target:'b',start:3,duration:1.5},{type:'fade_in',target:'c',start:4.5,duration:.7}]});
};

genBtn.onclick=async()=>{
  const prompt=promptEl.value.trim(); if(!prompt) return;
  genBtn.disabled=true; statusEl.textContent='Generating scene…';
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt})});
    const data=await r.json(); if(!r.ok) throw new Error(data.error||'Request failed');
    showScene(data.scene); statusEl.textContent='Done.';
  }catch(e){ statusEl.textContent=e.message; }
  finally{ genBtn.disabled=false; }
};

demoBtn.click();
</script>
</body>
</html>
